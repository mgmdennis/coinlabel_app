    function openAddDialog(questId, requirementId, trigger) {
      state.addDialog = { questId, reqId: requirementId };
      showDialog(addDialog, addDialogHtml(), {
        labelledby: 'add-dialog-title',
        focus: '#add-year',
        returnEl: trigger,
        returnSelector: `[data-action="add-coin"][data-req="${requirementId}"]`,
      });
    }

    function setFieldError(input, errorId, message) {
      const error = document.getElementById(errorId);
      if (error) {
        error.textContent = message;
        error.hidden = false;
      }
      if (input) {
        input.setAttribute('aria-invalid', 'true');
        input.focus();
      }
    }

    function clearFieldError(input, errorId) {
      const error = document.getElementById(errorId);
      if (error) {
        error.hidden = true;
        error.textContent = '';
      }
      if (input) input.removeAttribute('aria-invalid');
    }

    function submitAdd() {
      if (!state.addDialog) return;
      const { questId, reqId } = state.addDialog;
      const quest = findQuest(questId);
      const requirement = quest?.requirements.find((item) => item.id === reqId);
      if (!quest || !requirement) return;

      const yearInput = document.getElementById('add-year');
      const year = yearInput ? yearInput.value.trim() : '';
      if (!year) {
        setFieldError(yearInput, 'add-year-error', 'Add the year shown on the coin or label.');
        return;
      }

      const issuerInput = document.getElementById('add-issuer');
      const issuer = issuerInput ? issuerInput.value.trim() || requirement.ruler : requirement.ruler;
      const denomination = document.getElementById('add-denomination')?.value || 'AR Denarius';
      const grade = document.getElementById('add-grade')?.value || '';
      const reference = document.getElementById('add-reference')?.value.trim() || '';
      const ocreId = document.getElementById('add-ocre')?.value.trim() || '';
      const confidence = document.querySelector('input[name="add-confidence"]:checked')?.value || 'certain';
      const coinId = typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function'
        ? crypto.randomUUID()
        : `coin-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;

      const before = getSnapshot();
      state.collection.push({
        id: coinId,
        issuer,
        issuerConfidence: confidence,
        denomination,
        year,
        reference,
        ocreId,
        grade,
        acquired: new Date().toISOString().slice(0, 10),
        note: '',
      });
      saveCollection();
      const after = getSnapshot();
      const newlyComplete = after.results.find((result, index) => result.complete && !before.results[index].complete);
      const changes = summarizeChanges(before, after);

      closeDialog(addDialog, { restore: false });
      state.addDialog = null;
      renderCurrent({ preserveScroll: true });

      if (newlyComplete) {
        showAward(newlyComplete.quest.id);
        return;
      }

      if (confidence === 'uncertain') {
        showToast('Coin recorded. Its uncertain attribution is now waiting for review.', 'warning');
      } else {
        showToast(changeMessage(`${requirement.ruler} added`, changes), 'success');
      }
      focusSoon([
        `[data-action="view-coin"][data-req="${reqId}"]`,
        `[data-action="add-coin"][data-req="${reqId}"]`,
        '#requirements-heading',
        '#view h1',
      ]);
    }

    function saveCoinEdit() {
      if (!state.coinDialog) return;
      const coin = getCoin(state.coinDialog.coinId);
      if (!coin) return;

      const issuerInput = document.getElementById('edit-issuer');
      const issuer = issuerInput ? issuerInput.value.trim() : '';
      if (!issuer) {
        setFieldError(issuerInput, 'edit-issuer-error', 'Enter the issuer as it appears on the coin or label.');
        return;
      }

      const before = getSnapshot();
      coin.issuer = issuer;
      coin.issuerConfidence = document.getElementById('edit-confidence')?.value || 'certain';
      coin.denomination = document.getElementById('edit-denomination')?.value || '';
      coin.year = document.getElementById('edit-year')?.value.trim() || '';
      coin.grade = document.getElementById('edit-grade')?.value || '';
      coin.reference = document.getElementById('edit-reference')?.value.trim() || '';
      coin.ocreId = document.getElementById('edit-ocre')?.value.trim() || '';
      saveCollection();
      const after = getSnapshot();
      const newlyComplete = after.results.find((result, index) => result.complete && !before.results[index].complete);
      const changes = summarizeChanges(before, after);
      const reqId = state.coinDialog.reqId;

      closeDialog(coinDialog, { restore: false });
      state.coinDialog = null;
      renderCurrent({ preserveScroll: true });

      if (newlyComplete) {
        showAward(newlyComplete.quest.id);
        return;
      }

      const lostBadge = changes.some(({ result, previous }) => !result.complete && previous.complete);
      showToast(changeMessage('Coin updated', changes), lostBadge ? 'warning' : 'success');
      focusSoon([
        reqId ? `[data-action="view-coin"][data-req="${reqId}"]` : '',
        reqId ? `[data-action="add-coin"][data-req="${reqId}"]` : '',
        '#requirements-heading',
        '#view h1',
      ].filter(Boolean));
    }

    function confirmAttribution(coinId, questId, requirementId, ruler) {
      const coin = getCoin(coinId);
      if (!coin) return;
      const before = getSnapshot();
      coin.issuer = ruler;
      coin.issuerConfidence = 'certain';
      saveCollection();
      const after = getSnapshot();
      const newlyComplete = after.results.find((result, index) => result.complete && !before.results[index].complete);
      const changes = summarizeChanges(before, after);

      if (newlyComplete) {
        closeDialog(coinDialog, { restore: false });
        state.coinDialog = null;
        renderCurrent({ preserveScroll: true });
        showAward(newlyComplete.quest.id);
        return;
      }

      state.coinDialog.editing = false;
      state.coinDialog.confirmingRemove = false;
      renderCurrent({ preserveScroll: true });
      renderCoinDialogContent({ focus: '#coin-dialog-title' });
      showToast(changeMessage(`${ruler} confirmed`, changes), 'success');
    }

    function removeCoin() {
      if (!state.coinDialog) return;
      const coin = getCoin(state.coinDialog.coinId);
      if (!coin) return;
      const reqId = state.coinDialog.reqId;
      const before = getSnapshot();
      state.collection = state.collection.filter((item) => item.id !== coin.id);
      saveCollection();
      const after = getSnapshot();
      const changes = summarizeChanges(before, after);

      closeDialog(coinDialog, { restore: false });
      state.coinDialog = null;
      renderCurrent({ preserveScroll: true });

      const lostBadge = changes.some(({ result, previous }) => !result.complete && previous.complete);
      showToast(changeMessage('Coin removed', changes), lostBadge ? 'warning' : 'success');
      focusSoon([
        reqId ? `[data-action="add-coin"][data-req="${reqId}"]` : '',
        reqId ? `[data-action="view-coin"][data-req="${reqId}"]` : '',
        '#requirements-heading',
        '#view h1',
      ].filter(Boolean));
    }

    // "Which of my matching coins fills this slot?" — a popup with every
    // candidate: the coin currently counted plus its alternates.
    function pickDialogHtml(quest, requirement) {
      const options = [requirement.coin, ...(requirement.alternateCoins ?? [])].filter(Boolean);
      const row = (coin) => `<div class="pick-row${coin.id === requirement.coin.id ? ' is-chosen' : ''}">
          <span class="od-row coin-thumb-row coin-thumb-row-mini">${coinThumbPair(coin, { alt: `${esc(coin.issuer)} coin` })}</span>
          <div class="od-fill">
            <p class="pick-coin">${esc(coin.issuer)} · ${esc(coinSummary(coin))}</p>
            <p class="reason">${icon('info', 14)}<span>${coin.id === requirement.coin.id ? 'Currently counted for this requirement.' : 'Also matches this requirement.'}</span></p>
          </div>
          ${coin.id === requirement.coin.id
            ? `<span class="chip chip-complete">${icon('check', 13)}Counted</span>`
            : `<button class="btn btn-sm" type="button" data-action="use-coin" data-quest="${esc(quest.id)}" data-req="${esc(requirement.id)}" data-coin="${esc(coin.id)}">Count this one</button>`}
        </div>`;
      const reset = requirement.claimed || options.length
        ? `<div class="pick-reset">
            <button class="btn btn-outline btn-sm" type="button" data-action="reset-coin" data-quest="${esc(quest.id)}" data-req="${esc(requirement.id)}">Reset to automatic pick</button>
            <p class="reason">${icon('info', 14)}<span>Without a pick, the first matching coin counts.</span></p>
          </div>`
        : '';
      return `<div class="dialog-head">
          <div>
            <p class="eyebrow">${esc(quest.title)}</p>
            <h2 id="pick-dialog-title" tabindex="-1">${esc(requirement.ruler)}</h2>
            <p class="dialog-sub">${options.length} ${options.length === 1 ? 'match' : 'matches'} in your cabinet</p>
          </div>
          <button class="icon-btn" type="button" data-action="close-dialog" data-dialog="pick-dialog" aria-label="Close coin picker">${icon('x', 20)}</button>
        </div>
        <div class="dialog-scroll">
          ${options.map(row).join('')}
          ${reset}
        </div>
        <div class="dialog-foot">
          <button class="btn btn-outline" type="button" data-action="close-dialog" data-dialog="pick-dialog">Done</button>
        </div>`;
    }

    function openPickDialog(questId, reqId, trigger) {
      const snapshot = getSnapshot();
      const result = snapshot.results.find((item) => item.quest.id === questId);
      const requirement = result?.requirements.find((item) => item.id === reqId);
      if (!result || !requirement) {
        showToast('That requirement is not available any more.', 'warning');
        return;
      }
      state.pickDialog = { questId, reqId };
      showDialog(pickDialog, pickDialogHtml(result.quest, requirement), {
        labelledby: 'pick-dialog-title',
        focus: '#pick-dialog-title',
        returnEl: trigger,
        returnSelector: `[data-action="open-pick"][data-quest="${questId}"][data-req="${reqId}"]`,
      });
    }

    function renderPickDialogContent() {
      if (!pickDialog.open || !state.pickDialog) return;
      const snapshot = getSnapshot();
      const result = snapshot.results.find((item) => item.quest.id === state.pickDialog.questId);
      const requirement = result?.requirements.find((item) => item.id === state.pickDialog.reqId);
      if (!result || !requirement) {
        closeDialog(pickDialog);
        return;
      }
      pickDialog.innerHTML = pickDialogHtml(result.quest, requirement);
    }

    function showAward(questId) {
      const snapshot = getSnapshot();
      const result = snapshot.results.find((item) => item.quest.id === questId);
      if (!result || !result.complete) return;
      const quest = result.quest;
      confettiBurst();

      const html = `<div class="dialog-head">
          <div>
            <p class="eyebrow">Quest complete</p>
            <h2 id="award-dialog-title" tabindex="-1">${esc(quest.title)}</h2>
          </div>
          <button class="icon-btn" type="button" data-action="close-dialog" data-dialog="award-dialog" aria-label="Close award">${icon('x', 20)}</button>
        </div>
        <div class="award-body">
          ${sealSvg(quest.badge, true, 132)}
          <p class="award-badge-name">${esc(quest.badge.name)} badge</p>
          <p class="award-copy">Every requirement is now represented in your cabinet. The badge stays with the quest while it remains complete.</p>
          <div class="award-stats">
            <div class="od-stat"><strong>${result.total}</strong><span>rulers collected</span></div>
            <div class="od-stat"><strong>${snapshot.summary.questsComplete}</strong><span>quests complete</span></div>
          </div>
        </div>
        <div class="dialog-foot dialog-foot-split">
          <button class="btn btn-outline" type="button" data-action="award-back">Back to quests</button>
          <button class="btn" type="button" data-action="award-view">View quest</button>
        </div>`;

      showDialog(awardDialog, html, {
        labelledby: 'award-dialog-title',
        focus: '[data-action="award-view"]',
        returnSelector: '#view h1',
      });
    }

    function goToRequirement(questId, requirementId) {
      if (state.view.name !== 'quest' || state.view.questId !== questId) {
        openQuest(questId);
      }
      if (state.requirementFilter !== 'all') {
        state.requirementFilter = 'all';
        renderCurrent({ preserveScroll: true });
      }

      requestAnimationFrame(() => {
        const row = document.getElementById(`req-${questId}-${requirementId}`);
        if (!row) return;
        row.scrollIntoView({
          behavior: prefersReducedMotion.matches ? 'auto' : 'smooth',
          block: 'center',
        });
        const button = row.querySelector('.req-action button');
        if (button) button.focus({ preventScroll: true });
      });
    }

    function setOverviewFilter(kind) {
      state.overviewFilter = kind;
      renderCurrent({
        preserveScroll: true,
        focusSelector: `[data-action="filter-quests"][data-filter="${kind}"]`,
      });
    }

    function setRequirementFilter(kind) {
      state.requirementFilter = kind;
      renderCurrent({
        preserveScroll: true,
        focusSelector: `[data-action="filter-requirements"][data-filter="${kind}"]`,
      });
    }

    function toggleMenu() {
      mobileOpen = !mobileOpen;
      mobileNav.hidden = !mobileOpen;
      menuToggle.setAttribute('aria-expanded', String(mobileOpen));
      if (mobileOpen) {
        requestAnimationFrame(() => {
          const firstLink = mobileNav.querySelector('a, button');
          if (firstLink) firstLink.focus();
        });
      } else {
        menuToggle.focus();
      }
    }

    function closeMobileMenu(options = {}) {
      if (!mobileOpen) return;
      mobileOpen = false;
      mobileNav.hidden = true;
      menuToggle.setAttribute('aria-expanded', 'false');
      if (options.restoreFocus) menuToggle.focus();
    }

    document.addEventListener('click', (event) => {
      const actionEl = event.target.closest('[data-action]');
      if (!actionEl) return;
      const action = actionEl.dataset.action;
      event.preventDefault();

      switch (action) {
        case 'toggle-menu':
          toggleMenu();
          break;
        case 'nav-quests':
          closeMobileMenu();
          if (state.view.name === 'overview') {
            window.scrollTo({ top: 0, left: 0, behavior: prefersReducedMotion.matches ? 'auto' : 'smooth' });
            const heading = document.querySelector('#view h1');
            if (heading) heading.focus({ preventScroll: true });
          } else {
            showOverview({ restoreScroll: true });
          }
          break;
        case 'back-overview':
          showOverview({ restoreScroll: true });
          break;
        case 'outside': {
          closeMobileMenu();
          const label = actionEl.dataset.label || 'That screen';
          showToast(`${label} lives in the full NumisTag app. This prototype focuses on Roman Imperial quests.`);
          break;
        }
        case 'logout':
          closeMobileMenu();
          showToast('Sign-out is handled by the full app. This prototype stays signed in as collector.');
          break;
        case 'filter-quests':
          setOverviewFilter(actionEl.dataset.filter || 'all');
          break;
        case 'filter-requirements':
          setRequirementFilter(actionEl.dataset.filter || 'all');
          break;
        case 'open-quest':
          openQuest(actionEl.dataset.quest);
          break;
        case 'next-requirement':
          closeMobileMenu();
          goToRequirement(actionEl.dataset.quest, actionEl.dataset.req);
          break;
        case 'view-coin':
          openCoinDialog(actionEl.dataset.coin, actionEl.dataset.req, actionEl);
          break;
        case 'add-coin':
          openAddDialog(actionEl.dataset.quest, actionEl.dataset.req, actionEl);
          break;
        case 'close-dialog':
          closeDialog(document.getElementById(actionEl.dataset.dialog));
          break;
        case 'edit-coin':
          if (!state.coinDialog) return;
          state.coinDialog.editing = true;
          state.coinDialog.confirmingRemove = false;
          renderCoinDialogContent({ focus: '#edit-issuer' });
          break;
        case 'cancel-edit-coin':
          if (!state.coinDialog) return;
          state.coinDialog.editing = false;
          renderCoinDialogContent({ focus: '[data-action="edit-coin"]' });
          break;
        case 'save-coin':
          saveCoinEdit();
          break;
        case 'ask-remove-coin':
          if (!state.coinDialog) return;
          state.coinDialog.confirmingRemove = true;
          renderCoinDialogContent({ focus: '[data-action="cancel-remove-coin"]' });
          break;
        case 'cancel-remove-coin':
          if (!state.coinDialog) return;
          state.coinDialog.confirmingRemove = false;
          renderCoinDialogContent({ focus: '[data-action="ask-remove-coin"]' });
          break;
        case 'remove-coin-confirm':
          removeCoin();
          break;
        case 'open-pick':
          closeMobileMenu();
          openPickDialog(actionEl.dataset.quest, actionEl.dataset.req, actionEl);
          break;
        case 'use-coin': {
          // Pick which matching coin fills this requirement — the choice is
          // stored as a claim so it survives reloads and recalculations.
          closeDialog(pickDialog, { restore: false });
          const { quest: useQuest, req: useReq, coin: useCoin } = actionEl.dataset;
          const before = getSnapshot();
          state.claims[useQuest] = state.claims[useQuest] ?? {};
          state.claims[useQuest][useReq] = useCoin;
          saveClaims();
          const after = getSnapshot();
          const newlyComplete = after.results.find((result, index) => result.complete && !before.results[index].complete);
          renderCurrent({ preserveScroll: true });
          if (newlyComplete) {
            showAward(newlyComplete.quest.id);
            return;
          }
          showToast(changeMessage('Coin counted instead', summarizeChanges(before, after)), 'success');
          break;
        }
        case 'reset-coin': {
          closeDialog(pickDialog, { restore: false });
          const { quest: rstQuest, req: rstReq } = actionEl.dataset;
          if (state.claims[rstQuest]) {
            delete state.claims[rstQuest][rstReq];
            if (Object.keys(state.claims[rstQuest]).length === 0) delete state.claims[rstQuest];
          }
          saveClaims();
          renderCurrent({ preserveScroll: true });
          showToast('Pick reset — matching uses the automatic choice again.', 'info');
          break;
        }
        case 'confirm-attribution':
          confirmAttribution(
            actionEl.dataset.coin,
            actionEl.dataset.quest,
            actionEl.dataset.req,
            actionEl.dataset.ruler,
          );
          break;
        case 'submit-add':
          submitAdd();
          break;
        case 'award-view':
          closeDialog(awardDialog, { restore: false });
          focusSoon(['#view h1']);
          break;
        case 'award-back':
          closeDialog(awardDialog, { restore: false });
          showOverview({ restoreScroll: true });
          break;
        default:
          break;
      }
    });

    document.addEventListener('input', (event) => {
      const input = event.target;
      if (input.id === 'add-year') clearFieldError(input, 'add-year-error');
      if (input.id === 'edit-issuer') clearFieldError(input, 'edit-issuer-error');
    });

    addDialog.addEventListener('keydown', (event) => {
      if (event.key !== 'Enter' || !event.target.closest('#add-form') || event.target.closest('button')) return;
      event.preventDefault();
      submitAdd();
    });

    coinDialog.addEventListener('keydown', (event) => {
      if (event.key !== 'Enter' || !event.target.closest('#coin-edit-form') || event.target.closest('button')) return;
      event.preventDefault();
      saveCoinEdit();
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && mobileOpen && !document.querySelector('dialog[open]')) {
        closeMobileMenu({ restoreFocus: true });
      }
    });

    window.addEventListener('popstate', syncFromLocation);
    window.addEventListener('hashchange', syncFromLocation);

    const initialQuest = window.location.hash.match(/^#\/quest\/([a-z0-9-]+)$/i);
    const initialQuestMatch = initialQuest ? findQuest(initialQuest[1]) : null;
    if (initialQuestMatch) {
      state.view = { name: 'quest', questId: initialQuestMatch.id };
      writeHash(`#/quest/${initialQuestMatch.id}`, { view: 'quest', id: initialQuestMatch.id }, true);
    } else {
      writeHash('#/quests', { view: 'overview' }, true);
    }

    renderCurrent({ scrollToY: window.scrollY });
  </script>
</body>
</html>
