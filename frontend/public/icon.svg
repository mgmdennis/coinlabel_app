<svg xmlns="http://w3.org" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Plastic highlight gradient for the Saflip pockets -->
    <linearGradient id="pocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.05" />
    </linearGradient>
    
    <!-- Metallic coin gradient -->
    <linearGradient id="coinGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#f2f2f2" />
      <stop offset="50%" stop-color="#cccccc" />
      <stop offset="100%" stop-color="#999999" />
    </linearGradient>

    <!-- Drop shadow for depth between overlapping flips -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#1a2332" />

  <g transform="translate(100, 50)">
    <!-- ==================== SAFLIP 1 (Left & Diagonal) ==================== -->
    <!-- The flexible center hinge indicator -->
    <line x1="150" y1="450" x2="250" y2="200" stroke="#5c708a" stroke-width="3" stroke-dasharray="4 4" />
    
    <!-- Pocket 1A: Left Vertical Base -->
    <g filter="url(#shadow)">
      <!-- Outer Plastic Square -->
      <rect x="50" y="300" width="150" height="150" rx="8" fill="url(#pocketGrad)" stroke="#8da2bb" stroke-width="3" />
      <!-- Inner heat-seal border line -->
      <rect x="58" y="308" width="134" height="134" rx="4" fill="none" stroke="#5c708a" stroke-width="1.5" stroke-dasharray="2 2" />
      <!-- Frosted Coin Window / Coin -->
      <circle cx="125" cy="375" r="45" fill="url(#coinGrad)" stroke="#b3c2d4" stroke-width="2" />
      <circle cx="125" cy="375" r="40" fill="none" stroke="#999" stroke-width="1" />
    </g>

    <!-- Pocket 1B: The Slanted Diagonal -->
    <g transform="rotate(22, 200, 300)" filter="url(#shadow)">
      <rect x="125" y="150" width="150" height="150" rx="8" fill="url(#pocketGrad)" stroke="#8da2bb" stroke-width="3" />
      <rect x="133" y="158" width="134" height="134" rx="4" fill="none" stroke="#5c708a" stroke-width="1.5" stroke-dasharray="2 2" />
      <!-- Empty pocket pocket or label insert side (semi-transparent) -->
      <rect x="150" y="175" width="100" height="100" rx="2" fill="#ffffff" fill-opacity="0.1" />
    </g>

    <!-- ==================== SAFLIP 2 (Right Vertical) ==================== -->
    <!-- Connection Hinge for Flip 2 -->
    <line x1="425" y1="225" x2="425" y2="375" stroke="#5c708a" stroke-width="3" stroke-dasharray="4 4" />

    <!-- Pocket 2A: Top Right Upper Stem -->
    <g filter="url(#shadow)">
      <rect x="350" y="75" width="150" height="150" rx="8" fill="url(#pocketGrad)" stroke="#8da2bb" stroke-width="3" />
      <rect x="358" y="83" width="134" height="134" rx="4" fill="none" stroke="#5c708a" stroke-width="1.5" stroke-dasharray="2 2" />
      <circle cx="425" cy="150" r="45" fill="url(#coinGrad)" stroke="#b3c2d4" stroke-width="2" />
      <circle cx="425" cy="150" r="40" fill="none" stroke="#999" stroke-width="1" />
    </g>

    <!-- Pocket 2B: Bottom Right Lower Stem -->
    <g filter="url(#shadow)">
      <rect x="350" y="225" width="150" height="150" rx="8" fill="url(#pocketGrad)" stroke="#8da2bb" stroke-width="3" />
      <rect x="358" y="233" width="134" height="134" rx="4" fill="none" stroke="#5c708a" stroke-width="1.5" stroke-dasharray="2 2" />
      <!-- White card identification insert peeking through -->
      <rect x="370" y="245" width="110" height="110" rx="4" fill="#fcfaf2" fill-opacity="0.85" />
      <!-- Faint lines on the insert paper -->
      <line x1="385" y1="280" x2="465" y2="280" stroke="#ccc" stroke-width="2" />
      <line x1="385" y1="310" x2="465" y2="310" stroke="#ccc" stroke-width="2" />
    </g>
  </g>
</svg>
